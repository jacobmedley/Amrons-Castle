name: Suggest an enhancement
description: Propose customization, an interaction improvement or a new idea.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: "Check BACKLOG.md and existing issues first. Character-name editing and selectable color themes are planned, not available in v0.1.0."
  - type: input
    id: backlog
    attributes:
      label: Related backlog ID or issue
      placeholder: AC-101, AC-102, or a new idea
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe who needs the change and when it matters.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives and relevant examples. Keep private data out of attachments.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How should the change be verified?
      description: Consider phone layouts, keyboard access, reduced motion, privacy and compatibility.
    validations:
      required: true
